<style>

<body>
<div id="app">
 <div id="board" aria-label="chess board"></div>
 <noscript><p style="color:#ff8080;text-align:center">JavaScript is disabled or blocked in this viewer. Open this file in Chrome or Firefox.</p></noscript>
 <div id="info">
  <div id="status">Loading Immortal Snail Chess&hellip;</div>

 </div>

<script>
/* ===== CORE (pure logic, testable) ===== */
var SnailCore = (function(){
  var FILES='abcdefgh';
  var SNAIL_START=['a4','a5']; // two snails on empty edge squares of the middle ranks; they move in this order
  var SNAIL_EVERY=3;         // snail steps after every 3rd Black move
  function fx(s){return FILES.indexOf(s[0]);} function ry(s){return +s[1]-1;}
  function sq(x,y){return FILES[x]+(y+1);}
  function sign(n){return n>0?1:n<0?-1:0;}
  // Build a chess.js instance where the snail square holds a blocker knight of the
  // side to move: it blocks rays (attacks/check/castling paths) and cannot be captured.
  function engine(st){
    var f=st.fen.split(' '); if(st.snails.indexOf(f[3])>=0) f[3]='-';
    var g=new Chess(); g.load(f.join(' '));
    st.snails.forEach(function(q){ if(q) g.put({type:'n',color:st.fen.split(' ')[1]},q); });
    return g;
  }
  function legalMoves(st,from){
    if(st.over) return [];
    var g=engine(st);

  function findKing(g,color){var b=g.board();for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=b[r][c];if(p&&p.type==='k'&&p.color===color)return FILES[c]+(8-r);}return null;}
  function fixCastling(fen){
    var p=fen.split(' '),g=new Chess();g.load(fen);var c='';
    function is(s,t,col){var x=g.get(s);return x&&x.type===t&&x.color===col;}
    if(p[2].indexOf('K')>=0&&is('e1','k','w')&&is('h1','r','w'))c+='K';
    if(p[2].indexOf('Q')>=0&&is('e1','k','w')&&is('a1','r','w'))c+='Q';
    if(p[2].indexOf('k')>=0&&is('e8','k','b')&&is('h8','r','b'))c+='k';
    if(p[2].indexOf('q')>=0&&is('e8','k','b')&&is('a8','r','b'))c+='q';
    p[2]=c||'-';return p.join(' ');
  }
  function posKey(st){return st.fen.split(' ').slice(0,4).join(' ')+' '+st.snails.join(',');}
  function newGame(fen,snails){
    var st={fen:fen||'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',snails:(typeof snails==='string'?[snails]:snails||SNAIL_START).slice(),
      blackMoves:0,last:null,trail:[],over:null,reps:{}};
    st.reps[posKey(st)]=1; evaluate(st); return st;
  }
  function clone(st){return JSON.parse(JSON.stringify(st));}
  // Snail 0 is the WHITE snail (starts a4) and hunts the BLACK king; snail 1 is the BLACK snail
  // (starts a5) and hunts the WHITE king. White snail moves first; if it kills a king the black one stays put.
  // Step choice among the 8 neighbours that are on-board, not the other snail, and strictly closer
  // (Chebyshev) to the target king, ranked by: Chebyshev distance, then avoid own-colour pieces
  // (own king worst), then the direct diagonal-first step, then squared distance, file, rank.
  // If no square qualifies the snail waits. It destroys whatever it steps on (own pieces included).
  function snailTurn(st){
    st.trail=[];
    for(var i=0;i<st.snails.length&&!st.over;i++) if(st.snails[i]) snailStep(st,i);
  }
  function snailStep(st,i){
    var g=new Chess();g.load(st.fen);
    var mine=i===0?'w':'b',best=findKing(g,mine==='w'?'b':'w');
    if(!best) return;
    var cur=st.snails[i],sx=fx(cur),sy=ry(cur),kx=fx(best),ky=ry(best);
    var bd=Math.max(Math.abs(kx-sx),Math.abs(ky-sy)),dxd=sx+sign(kx-sx),dyd=sy+sign(ky-sy),c=[];
    for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var x=sx+dx,y=sy+dy;
      if(!(dx||dy)||x<0||x>7||y<0||y>7||st.snails.indexOf(sq(x,y))>=0)continue;
      var ch=Math.max(Math.abs(kx-x),Math.abs(ky-y));if(ch>=bd)continue;

      c.push([ch,own,(x===dxd&&y===dyd)?0:1,(kx-x)*(kx-x)+(ky-y)*(ky-y),x,y]);}
    c.sort(function(a,b){for(var k=0;k<6;k++)if(a[k]!==b[k])return a[k]-b[k];return 0;});
    if(!c.length) return;
    var to=sq(c[0][4],c[0][5]),victim=g.get(to);
    st.snails[i]=to; st.trail.push(cur,to);
    var q=st.fen.split(' ');q[3]='-';
    if(victim){
      g.remove(to); q[0]=g.fen().split(' ')[0];
      st.fen=fixCastling(q.join(' '));
      if(victim.type==='k'){ var vn=victim.color==='w'?'White':'Black',wn=victim.color==='w'?'Black':'White';
        st.over={type:'snail',winner:victim.color==='w'?'b':'w',msg:'\ud83d\udc0c The '+(mine==='w'?'white':'black')+' snail crushed the '+vn+' king! '+wn+' wins.'}; }
    } else st.fen=q.join(' ');
  }
  function insufficient(fen){
    var b=fen.split(' ')[0].replace(/[\/1-8kK]/g,'');
    if(b==='')return true;
    if(/^[nNbB]$/.test(b))return true;
    return false;
  }
  function evaluate(st){
    if(st.over) return st.over;
    var turn=st.fen.split(' ')[1],name=turn==='w'?'White':'Black';
    // Opponent king left en prise (only possible after a snail destroys a shield)
    var t=st.fen.split(' ');t[1]=turn==='w'?'b':'w';t[3]='-';
    var o=engine({fen:t.join(' '),snails:st.snails});
    if(o.in_check()){st.over={type:'exposed',winner:turn,msg:(turn==='w'?'Black':'White')+'\u2019s king was left exposed by the snail. '+name+' wins.'};return st.over;}
    var g=engine(st),ms=legalMoves(st),chk=g.in_check();
    st.check=chk?findKing(g,turn):null;
    if(!ms.length){st.over=chk?{type:'mate',winner:turn==='w'?'b':'w',msg:'Checkmate! '+(turn==='w'?'Black':'White')+' wins.'}:{type:'stalemate',winner:null,msg:'Stalemate \u2014 draw.'};}
    else if(+st.fen.split(' ')[4]>=100) st.over={type:'fifty',winner:null,msg:'Draw by 50-move rule.'};
    else if(st.reps[posKey(st)]>=3) st.over={type:'threefold',winner:null,msg:'Draw by threefold repetition.'};
    else if(insufficient(st.fen)) st.over={type:'material',winner:null,msg:'Draw \u2014 insufficient material.'};
    return st.over;
  }
  // Returns new state, or null if illegal. Does not mutate input.
  function play(st,from,to,promo){
    if(st.over) return null;
    var cand=legalMoves(st,from).filter(function(m){return m.to===to;});
    if(!cand.length) return null;
    if(cand.some(function(m){return m.promotion;})){promo=promo||'q';cand=cand.filter(function(m){return m.promotion===promo;});if(!cand.length)return null;}
    var ns=clone(st),g=engine(ns),mover=ns.fen.split(' ')[1];
    var m=g.move({from:from,to:to,promotion:cand[0].promotion});
    if(!m) return null;
    ns.snails.forEach(function(q){ if(q) g.remove(q); });
    ns.fen=g.fen(); ns.last={from:from,to:to,san:m.san}; ns.trail=[]; ns.check=null;
    if(mover==='b'){ ns.blackMoves++; if(ns.blackMoves%SNAIL_EVERY===0) snailTurn(ns); }
    var k=posKey(ns); ns.reps[k]=(ns.reps[k]||0)+1;
    evaluate(ns); return ns;
  }
  return {newGame:newGame,legalMoves:legalMoves,play:play,evaluate:evaluate,engine:engine,SNAIL_EVERY:SNAIL_EVERY,SNAIL_START:SNAIL_START};
})();
/* ===== END CORE ===== */

/* ===== UI ===== */
function __fatal(msg){var e=document.getElementById('status');if(e){e.style.whiteSpace='normal';e.style.color='#ff8080';e.textContent='Error: '+msg;}}
if(typeof window!=='undefined'){window.onerror=function(m){__fatal(m);};}
(function(){
  if(typeof document==='undefined'||!document.getElementById('board'))return;
  if(typeof Chess==='undefined'){__fatal('chess engine failed to load.');return;}
  var GLYPH={k:'\u265a',q:'\u265b',r:'\u265c',b:'\u265d',n:'\u265e',p:'\u265f'};
  var boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),promoEl=document.getElementById('promo');
  var st,hist,flipped=false,sel=null,targets=[],pending=null;
  function reset(){st=SnailCore.newGame();hist=[];sel=null;targets=[];render();}
  function cellAt(name){return boardEl.querySelector('[data-sq="'+name+'"]');}
  function render(){
    var g=new Chess();g.load(st.fen);boardEl.innerHTML='';
    for(var i=0;i<64;i++){
      var r=flipped?Math.floor(i/8):7-Math.floor(i/8),c=flipped?7-i%8:i%8,name='abcdefgh'[c]+(r+1);
      var d=document.createElement('div');d.className='sq '+((r+c)%2?'light':'dark');d.dataset.sq=name;
      if(st.last&&(st.last.from===name||st.last.to===name))d.classList.add('last');
      if(st.trail&&st.trail.indexOf(name)>=0)d.classList.add('trail');
      if(sel===name)d.classList.add('sel');
      if(st.check===name&&!st.over)d.classList.add('check');
      var p=g.get(name);
      if(st.snails.indexOf(name)>=0){d.insertAdjacentHTML('beforeend','<span class="pc sn '+(st.snails.indexOf(name)===0?'snw':'snb')+'" title="'+(st.snails.indexOf(name)===0?'White':'Black')+' snail">\ud83d\udc0c</span>');}
      else if(p){d.insertAdjacentHTML('beforeend','<span class="pc '+(p.color==='w'?'pw':'pb')+'">'+GLYPH[p.type]+'\uFE0E</span>');}
      var t=targets.filter(function(m){return m.to===name;})[0];
      if(t)d.insertAdjacentHTML('beforeend',(p||t.flags.indexOf('e')>=0)?'<span class="ring"></span>':'<span class="dot"></span>');
      if((flipped?r===7:r===0))d.insertAdjacentHTML('beforeend','<span class="coord f">'+'abcdefgh'[c]+'</span>');
      if((flipped?c===7:c===0))d.insertAdjacentHTML('beforeend','<span class="coord r">'+(r+1)+'</span>');
      boardEl.appendChild(d);
    }
    var turn=st.fen.split(' ')[1]==='w'?'White':'Black',left=SnailCore.SNAIL_EVERY-st.blackMoves%SNAIL_EVERY;
    statusEl.textContent=st.over?st.over.msg:(turn+' to move'+(st.check?' \u2014 CHECK!':'')+' \u00b7 \ud83d\udc0c\ud83d\udc0c move in '+left+' Black move'+(left>1?'s':''));
    document.getElementById('undoBtn').disabled=!hist.length;
  }
  var SNAIL_EVERY=SnailCore.SNAIL_EVERY;
  function tap(name){
    if(st.over||pending)return;
    if(sel&&targets.some(function(m){return m.to===name;})){
      var isPromo=targets.some(function(m){return m.to===name&&m.promotion;});
      if(isPromo){askPromo(sel,name);return;}
      doMove(sel,name);return;
    }
    var own=SnailCore.legalMoves(st,name);
    if(sel===name||!own.length){sel=null;targets=[];}else{sel=name;targets=own;}
    render();
  }
  function doMove(f,t,pr){var ns=SnailCore.play(st,f,t,pr);if(ns){hist.push(st);st=ns;}sel=null;targets=[];render();}
  function askPromo(f,t){
    pending=true;var color=st.fen.split(' ')[1],box=promoEl.firstElementChild;box.innerHTML='';
    ['q','r','b','n'].forEach(function(p){var b=document.createElement('button');b.textContent=GLYPH[p];b.className=color==='w'?'pw':'pb';
      b.onclick=function(){promoEl.style.display='none';pending=null;doMove(f,t,p);};box.appendChild(b);});
    promoEl.style.display='flex';
  }
  promoEl.addEventListener('click',function(e){if(e.target===promoEl){promoEl.style.display='none';pending=null;sel=null;targets=[];render();}});
  boardEl.addEventListener('click',function(e){var c=e.target.closest('.sq');if(c)tap(c.dataset.sq);});
  document.getElementById('newBtn').onclick=reset;
  document.getElementById('undoBtn').onclick=function(){if(hist.length){st=hist.pop();sel=null;targets=[];render();}};
  document.getElementById('flipBtn').onclick=function(){flipped=!flipped;render();};
  window.__snail={get st(){return st;},tap:tap,get flipped(){return flipped;}};
  reset();
})();
</script>
